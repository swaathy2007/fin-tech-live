services:
  - type: web
    name: finsight-fastapi-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finsight-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: finsight-redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: finsight-postgres
    databaseName: finsight_db
    user: finsight_user

  - type: redis
    name: finsight-redis
    ipAllowList: []
